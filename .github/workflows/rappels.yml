# Envoie les rappels de séance (notifications) toutes les heures.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
# SUPABASE_SERVICE_ROLE_KEY et VAPID_PRIVATE_KEY. Voir docs/MISE-EN-LIGNE.md.
# Sans ces secrets, le job se termine sans rien envoyer.
name: Rappels de séance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node scripts/rappels.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
